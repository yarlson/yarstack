name: Feature request
description: Propose a focused capability or marketplace improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should Yarstack solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not a preferred implementation.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      options:
        - Codex and Claude Code
        - Codex only
        - Claude Code only
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Permissions and risks
      description: Note any network access, credentials, writes, executables, or dependencies involved.
