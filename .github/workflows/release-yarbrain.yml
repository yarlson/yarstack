name: release-yarbrain

on:
  push:
    tags:
      - "plugins/yarbrain/cli/v*"

permissions:
  contents: read

concurrency:
  group: release-yarbrain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tag to point at a commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          working_directory: plugins/yarbrain/cli

      - name: Run the CLI checks
        run: make -C plugins/yarbrain/cli ci

      # goreleaser OSS cannot read a prefixed tag, so it gets the bare version.
      - name: Build and stage the release binaries
        working-directory: plugins/yarbrain/cli
        run: |
          GORELEASER_CURRENT_TAG="v${TAG#plugins/yarbrain/cli/v}" goreleaser release --clean --skip=validate
          make release-assets

      - name: Publish the release
        working-directory: plugins/yarbrain/cli
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "yarbrain ${TAG#plugins/yarbrain/cli/}" \
              --notes "Install with install.sh (macOS, Linux) or install.ps1 (Windows) from this release."
          fi
          gh release upload "$TAG" release/* --clobber

      - name: Verify the published binaries
        run: |
          mkdir verify
          cd verify
          gh release download "$TAG" --pattern 'yarbrain_*' --pattern checksums.txt
          sha256sum --check --strict checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: verify/checksums.txt
